[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-semantic-router"
version = "0.1.0"
description = "Latency-optimal intent classification and cost-aware model tier routing for agent prompts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-semantic-router = "agent_semantic_router.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_semantic_router*"]
